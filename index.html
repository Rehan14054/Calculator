<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <input type="text" id="num" placeholder="0" />

      <div class="buttons">
        <div class="row row1">
          <button type="button" class="my-btn">9</button>
          <button type="button" class="my-btn">8</button>
          <button type="button" class="my-btn">7</button>
          <button type="button" class="my-btn">DEL</button>
        </div>
        <div class="row row2">
          <button type="button" class="my-btn">6</button>
          <button type="button" class="my-btn">5</button>
          <button type="button" class="my-btn">4</button>
          <button type="button" class="my-btn">+</button>
        </div>
        <div class="row row3">
          <button type="button" class="my-btn">3</button>
          <button type="button" class="my-btn">2</button>
          <button type="button" class="my-btn">1</button>
          <button type="button" class="my-btn">-</button>
        </div>
        <div class="row row3">
          <button type="button" class="my-btn">.</button>
          <button type="button" class="my-btn">0</button>
          <button type="button" class="my-btn">/</button>
          <button type="button" class="my-btn">x</button>
        </div>
        <div class="row row3">
          <button type="button" class="my-btn big-btn big-btn-blue">RESET</button>
          <button type="button" class="my-btn big-btn big-btn-red">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
